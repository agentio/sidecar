name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.6'

    - name: Build
      run: make

    - name: Test
      run: make test
